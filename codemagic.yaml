# Codemagic CI/CD for TriggerTrace - iOS
workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - apiconfig
        - apple_auth
      ios_signing:
        provisioning_profiles:
          - "EczemaCare ios_app_store 1772991975"
      vars:
        BUNDLE_ID: "com.orions.eczemacare"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Auto-increment build number
        script: |
          cd ios
          agvtool new-version -all $BUILD_ID
          cd ..
      - name: Build iOS
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=REVENUECAT_APPLE_KEY=$REVENUECAT_APPLE_KEY \
            --dart-define=REVENUECAT_GOOGLE_KEY=$REVENUECAT_GOOGLE_KEY
      - name: Package IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner \
            --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - "build/ios/ipa/*.ipa"
    publishing:
      app_store_connect:
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        submit_to_testflight: true
        submit_to_app_store: false
