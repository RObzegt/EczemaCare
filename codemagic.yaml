# Codemagic CI/CD for TriggerTrace - iOS
workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - apiconfig
        - apple_auth

      ios_signing:
        provisioning_profiles:
          - "EczemaCare ios_app_store 1772991975"

      vars:
        BUNDLE_ID: "com.orions.eczemacare"
        ARCHIVE_PATH: "/Users/builder/clone/build/ios/xcarchive/Runner.xcarchive"
        EXPORT_PATH: "/Users/builder/clone/build/ios/ipa"

      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      # 🔹 Install packages
      - name: Install dependencies
        script: |
          flutter pub get

      # 🔹 AUTO BUMP MARKETING VERSION
      - name: Auto-bump CFBundleShortVersionString
        script: |
          echo "🔼 Auto bumping marketing version..."

          CURRENT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" ios/Runner/Info.plist)
          echo "Current marketing version: $CURRENT_VERSION"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"

          echo "New marketing version: $NEW_VERSION"

          cd ios
          agvtool new-marketing-version $NEW_VERSION
          cd ..

      # 🔹 AUTO INCREMENT BUILD NUMBER
      - name: Auto-increment build number
        script: |
          BUILD_NUM=$((${BUILD_NUMBER:-0} + 100))
          echo "Setting build number to: $BUILD_NUM"
          cd ios
