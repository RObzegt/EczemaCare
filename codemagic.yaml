# Codemagic CI/CD — TriggerTrace / EczemaCare (Flutter iOS)
# Zie CODEMAGIC.md voor setup-instructies.

workflows:

  # ── ios-verify ──────────────────────────────────────────────────────────────
  # Snelle compile-check zonder signing. Start handmatig in Codemagic UI.
  # Geen automatische trigger zodat elke push niet dubbel gebuild wordt.
  ios-verify:
    name: iOS Verify (geen IPA)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Dependencies & analyse
        script: |
          set -e
          flutter --version
          flutter pub get
          flutter analyze
      - name: iOS compile check (no codesign)
        script: |
          set -e
          flutter precache --ios
          flutter build ios --config-only --no-codesign
          cd ios && pod install && cd ..

  # ── ios-release ─────────────────────────────────────────────────────────────
  # Bouwt IPA en uploadt naar TestFlight.
  # Vereist: env groups apiconfig + apple_auth, iOS cert + provisioning profile.
  ios-release:
    name: iOS Release → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - apiconfig
        - apple_auth
      ios_signing:
        provisioning_profiles:
          - "EczemaCare ios_app_store 1772991975"
      vars:
        BUNDLE_ID: com.orions.eczemacare
        ARCHIVE_PATH: /Users/builder/clone/build/ios/xcarchive/Runner.xcarchive
        EXPORT_PATH: /Users/builder/clone/build/ios/ipa
      flutter: stable
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true

    scripts:
      - name: Install dependencies
        script: |
          set -e
          flutter --version
          flutter pub get
          flutter precache --ios

      - name: Sync CocoaPods with Podfile
        script: |
          set -e
          flutter build ios --config-only --no-codesign \
            --dart-define=REVENUECAT_APPLE_KEY=${REVENUECAT_APPLE_KEY} \
            --dart-define=REVENUECAT_GOOGLE_KEY=${REVENUECAT_GOOGLE_KEY}
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS (versie uit pubspec + CM build number)
        script: |
          set -e

          CURRENT=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version: *//')
          VERSION_PART=$(echo "$CURRENT" | sed 's/+.*//')
          BUILD_NUM=$(( ${CM_BUILD_NUMBER:-1} + 500 ))

          echo "Version: $VERSION_PART  |  Build: $BUILD_NUM"

          cd ios
          agvtool new-marketing-version "$VERSION_PART"
          agvtool new-version -all "$BUILD_NUM"
          pod install
          cd ..

          flutter build ios --release --no-codesign \
            --build-name="$VERSION_PART" \
            --build-number="$BUILD_NUM" \
            --dart-define=REVENUECAT_APPLE_KEY=${REVENUECAT_APPLE_KEY} \
            --dart-define=REVENUECAT_GOOGLE_KEY=${REVENUECAT_GOOGLE_KEY}

          grep -E "FLUTTER_BUILD" ios/Flutter/Generated.xcconfig

      - name: Set up code signing
        script: |
          set -e
          xcode-project use-profiles

      - name: Verify signing config
        script: |
          xcodebuild -version
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -showBuildSettings 2>&1 \
            | grep -E "MARKETING_VERSION|CURRENT_PROJECT_VERSION|CODE_SIGN|DEVELOPMENT_TEAM|PROVISIONING|PRODUCT_BUNDLE|ENTITLEMENTS"

      - name: Archive
        script: |
          set -e
          set -o pipefail
          mkdir -p "$(dirname "$ARCHIVE_PATH")"

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            -allowProvisioningUpdates \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee /tmp/xcodebuild_archive.log || {
              echo "--- XCODEBUILD ARCHIVE FAILED (last 80 lines) ---"
              tail -80 /tmp/xcodebuild_archive.log
              exit 1
            }

          ls -lah "$(dirname "$ARCHIVE_PATH")"

      - name: Export IPA
        script: |
          set -e

          PROFILE_NAME=$(xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner -configuration Release -showBuildSettings 2>/dev/null \
            | grep 'PROVISIONING_PROFILE_SPECIFIER' | head -1 | sed 's/.*= *//')

          if [ -z "$PROFILE_NAME" ]; then
            for p in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
              PNAME=$(security cms -D -i "$p" 2>/dev/null | plutil -extract Name raw -o - - 2>/dev/null || true)
              PBUNDLE=$(security cms -D -i "$p" 2>/dev/null \
                | plutil -extract Entitlements.application-identifier raw -o - - 2>/dev/null || true)
              echo "Profile: $PNAME  bundle: $PBUNDLE"
              if echo "$PBUNDLE" | grep -q "com.orions.eczemacare"; then
                PROFILE_NAME="$PNAME"
                echo "Matched: $PROFILE_NAME"
                break
              fi
            done
          fi

          if [ -z "$PROFILE_NAME" ]; then
            echo "ERROR: geen provisioning profile gevonden voor com.orions.eczemacare"
            echo "Upload profiel in Codemagic → Code signing identities → iOS"
            exit 1
          fi

          echo "Using profile: $PROFILE_NAME"

          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            echo '<plist version="1.0"><dict>'
            echo '  <key>method</key><string>app-store-connect</string>'
            echo '  <key>signingStyle</key><string>manual</string>'
            echo '  <key>teamID</key><string>JTY452RWN4</string>'
            echo '  <key>uploadSymbols</key><true/>'
            echo '  <key>compileBitcode</key><false/>'
            echo '  <key>provisioningProfiles</key>'
            echo '  <dict>'
            echo "    <key>com.orions.eczemacare</key><string>${PROFILE_NAME}</string>"
            echo '  </dict>'
            echo '</dict></plist>'
          } > /tmp/ExportOptions.plist

          echo "=== ExportOptions.plist ===" && cat /tmp/ExportOptions.plist

          mkdir -p "$EXPORT_PATH"
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -allowProvisioningUpdates \
            2>&1 | tee /tmp/xcodebuild_export.log || {
              echo "--- EXPORT FAILED (last 30 lines) ---"
              tail -30 /tmp/xcodebuild_export.log
              exit 1
            }

          ls -lah "$EXPORT_PATH"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_archive.log
      - /tmp/xcodebuild_export.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
