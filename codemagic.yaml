workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - apple_auth
      vars:
        APP_ID: "6760238014"
        BUNDLE_ID: "com.orions.eczemacare"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Initialize keychain
        script: keychain initialize
      - name: Generate certificate key
        script: |
          openssl ecparam -genkey -name prime256v1 -noout -out /tmp/cert_key.pem
          echo "Certificate key generated"
          cat /tmp/cert_key.pem | head -1
      - name: Fetch signing files
        script: |
          set -e
          echo "=== Listing existing certificates ==="
          app-store-connect certificates list --type IOS_DISTRIBUTION || echo "No existing certs"
          echo "=== Listing existing profiles ==="
          app-store-connect profiles list --type IOS_APP_STORE || echo "No existing profiles"
          echo "=== Fetching/creating signing files ==="
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key /tmp/cert_key.pem \
            --verbose
          echo "=== Done fetching signing files ==="
          echo "=== Listing certificates after ==="
          app-store-connect certificates list --type IOS_DISTRIBUTION || echo "No certs found after"
          echo "=== Listing profiles after ==="
          app-store-connect profiles list --type IOS_APP_STORE || echo "No profiles found after"
      - name: Add certificates to keychain
        script: |
          echo "=== Adding certificates to keychain ==="
          keychain add-certificates
          echo "=== Done adding certificates ==="
      - name: Apply profiles to Xcode project
        script: |
          echo "=== Applying profiles ==="
          xcode-project use-profiles --project ios/Runner.xcodeproj
          echo "=== Done applying profiles ==="
          echo "=== Checking project signing ==="
          grep -A 5 "CODE_SIGN" ios/Runner.xcodeproj/project.pbxproj | head -20 || echo "No signing found"
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - tulp@Outlook.com
        notify:
          success: true
          failure: true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
