name: gezondheids_tracker
description: Track food intake and health symptoms with AI pattern detection. Monitor eczema, energy, and stress levels daily.
publish_to: 'none'
version: 1.3.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # UI Components
  cupertino_icons: ^1.0.6
  fl_chart: ^0.66.0
  
  # Utilities
  intl: ^0.20.0
  uuid: ^4.2.2
  url_launcher: ^6.2.5
  http: ^1.2.0
  
  # Data Persistence (optioneel voor later)
  shared_preferences: ^2.2.2
  
  # In-App Purchases (RevenueCat)
  purchases_flutter: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
