<!DOCTYPE html>
<html>
<head>
    <title>Data Persistence Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            background: #f5f5f5;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        button {
            background: #2196F3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #1976D2;
        }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        pre {
            background: white;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            max-height: 300px;
        }
    </style>
</head>
<body>
    <h1>🔍 Gezondheids Tracker - Data Persistence Test</h1>
    
    <div class="test-section">
        <h2>Test 1: Check if Data Exists</h2>
        <button onclick="checkData()">Check localStorage</button>
        <div id="result1"></div>
    </div>

    <div class="test-section">
        <h2>Test 2: View Saved Data</h2>
        <button onclick="viewData()">Show All Data</button>
        <div id="result2"></div>
    </div>

    <div class="test-section">
        <h2>Test 3: Save Test Entry</h2>
        <button onclick="saveTestEntry()">Save Test Entry</button>
        <div id="result3"></div>
    </div>

    <div class="test-section">
        <h2>Test 4: Clear All Data</h2>
        <button onclick="clearData()" style="background: #f44336;">Clear Everything</button>
        <div id="result4"></div>
    </div>

    <script>
        function checkData() {
            const result = document.getElementById('result1');
            const data = localStorage.getItem('flutter.dagboek_entries');
            
            if (data) {
                const parsed = JSON.parse(data);
                result.innerHTML = `
                    <p class="success">✅ Data found in localStorage!</p>
                    <p>Key: <code>flutter.dagboek_entries</code></p>
                    <p>Size: <strong>${data.length}</strong> characters</p>
                    <p>Entries: <strong>${parsed.length}</strong> days</p>
                `;
            } else {
                result.innerHTML = `
                    <p class="error">❌ No data found in localStorage</p>
                    <p>This means the app hasn't saved any data yet.</p>
                `;
            }
        }

        function viewData() {
            const result = document.getElementById('result2');
            const data = localStorage.getItem('flutter.dagboek_entries');
            
            if (data) {
                try {
                    const parsed = JSON.parse(data);
                    let html = `<p class="success">Found ${parsed.length} entries:</p><pre>`;
                    
                    parsed.forEach((entry, index) => {
                        const date = new Date(entry.datum);
                        html += `\n[${index + 1}] ${date.toLocaleDateString('nl-NL')}:\n`;
                        
                        if (entry.voedselEntries && entry.voedselEntries.length > 0) {
                            html += `  Voedsel:\n`;
                            entry.voedselEntries.forEach(v => {
                                html += `    - ${v.beschrijving}\n`;
                                if (v.ingredienten) {
                                    html += `      Ingredienten: ${v.ingredienten.join(', ')}\n`;
                                }
                            });
                        }
                        
                        if (entry.gezondheidsMetrics && entry.gezondheidsMetrics.length > 0) {
                            const m = entry.gezondheidsMetrics[0];
                            html += `  Gezondheid:\n`;
                            html += `    Eczeem Ernstig: ${m.eczeemErnstig}\n`;
                            html += `    Eczeem Mild: ${m.eczeemMild}\n`;
                            html += `    Geen Eczeem: ${m.geenEczeem}\n`;
                        }
                    });
                    
                    html += '</pre>';
                    result.innerHTML = html;
                } catch (e) {
                    result.innerHTML = `<p class="error">❌ Error parsing data: ${e.message}</p>`;
                }
            } else {
                result.innerHTML = `<p class="error">❌ No data to display</p>`;
            }
        }

        function saveTestEntry() {
            const result = document.getElementById('result3');
            const data = localStorage.getItem('flutter.dagboek_entries');
            let entries = data ? JSON.parse(data) : [];
            
            // Add a test entry
            const testEntry = {
                datum: new Date().toISOString(),
                voedselEntries: [{
                    categorie: 'ontbijt',
                    beschrijving: 'TEST ENTRY - DO NOT DELETE',
                    ingredienten: ['Test', 'Item'],
                    tijdstip: new Date().toISOString()
                }],
                gezondheidsMetrics: [{
                    eczeemErnstig: 9,
                    eczeemJeuken: 0,
                    eczeemMild: 9,
                    slaapKwaliteit: 9,
                    geenEczeem: 9,
                    tijdstip: new Date().toISOString()
                }]
            };
            
            entries.unshift(testEntry);
            localStorage.setItem('flutter.dagboek_entries', JSON.stringify(entries));
            
            result.innerHTML = `
                <p class="success">✅ Test entry saved!</p>
                <p>Reload the Flutter app to see it.</p>
                <p>Look for: <strong>"TEST ENTRY - DO NOT DELETE"</strong></p>
            `;
        }

        function clearData() {
            const result = document.getElementById('result4');
            const confirmed = confirm('Are you sure? This will delete ALL data!');
            
            if (confirmed) {
                localStorage.clear();
                result.innerHTML = `
                    <p class="success">✅ All data cleared!</p>
                    <p>Reload the Flutter app to start fresh with sample data.</p>
                `;
            }
        }

        // Run initial check
        window.onload = () => {
            checkData();
        };
    </script>
</body>
</html>
